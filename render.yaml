services:
  - type: web
    name: bidgetcheck
    runtime: docker
    plan: free
    healthCheckPath: /api/health
    envVars:
      - key: BC_ENV
        value: production
      - key: BC_LLM_PROVIDER
        value: gemini
      - key: BC_GEMINI_MODEL
        value: gemini-3.7-flash
      - key: BC_GEMINI_API_KEY
        sync: false
      - key: BC_LLM_DELAY_MS
        value: "2000"
      - key: BC_DATABASE_URL
        fromDatabase:
          name: bidgetcheck-db
          property: connectionString
      - key: BC_DATA_DIR
        value: /data
      - key: PUBLIC_BASE_URL
        value: https://bidgetcheck.onrender.com
      - key: BC_SESSION_TTL_DAYS
        value: "30"
      - key: BC_FREE_QUOTA
        value: "3"
      - key: BC_FREE_MAX_PAGES
        value: "80"
      - key: BC_PRO_QUOTA
        value: "150"
      - key: LS_API_KEY
        sync: false
      - key: LS_STORE_ID
        sync: false
      - key: LS_SIGNING_SECRET
        sync: false
      - key: LS_VARIANT_MONTHLY
        sync: false
      - key: LS_VARIANT_ONEOFF
        sync: false
    disk:
      name: uploads
      mountPath: /data
      sizeGB: 1

databases:
  - name: bidgetcheck-db
    databaseName: bidgetcheck
    user: bidgetcheck
    plan: free
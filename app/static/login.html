<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sign in - BidGapCheck</title>
<link rel="stylesheet" href="/static/site.css">
</head>
<body class="center">

<div class="authcard">
  <a class="brand" href="/">BidGapCheck</a>
  <h1>Sign in</h1>
  <form onsubmit="event.preventDefault();submitAuth(event,'/api/auth/login','/app');">
    <input type="email" name="email" placeholder="Work email" required autocomplete="email">
    <input type="password" name="password" placeholder="Password" required autocomplete="current-password">
    <button type="submit">Sign in</button>
  </form>
  <p class="msg" id="msg"></p>
  <p class="alt">No account? <a href="/signup">Create one free</a>.</p>
</div>

<script src="/static/auth.js"></script>
</body>
</html>
